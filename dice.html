<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dés</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f7f5f2;
      --surface: #ffffff;
      --border: #e8e4de;
      --text: #1a1916;
      --muted: #9b9690;
      --dot: #1a1916;
      --shadow: 0 2px 16px rgba(0,0,0,0.06);
      --radius: 14px;
      --die: 76px;
    }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 56px 24px 96px;
    }

    header { text-align: center; margin-bottom: 52px; }
    h1 { font-size: 1.5rem; font-weight: 600; letter-spacing: -0.02em; }
    h1 span { color: var(--muted); font-weight: 400; }

    /* Controls */
    .controls {
      display: flex;
      align-items: center;
      gap: 24px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px 30px;
      box-shadow: var(--shadow);
      margin-bottom: 28px;
    }
    .count-label { font-size: 0.78rem; color: var(--muted); letter-spacing: 0.06em; text-transform: uppercase; }
    .stepper { display: flex; align-items: center; gap: 16px; }
    .stepper button {
      width: 30px; height: 30px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-size: 1rem;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.12s;
      user-select: none;
    }
    .stepper button:hover:not(:disabled) { background: var(--border); }
    .stepper button:disabled { opacity: 0.28; cursor: not-allowed; }
    #dice-count { font-size: 1.5rem; font-weight: 600; min-width: 26px; text-align: center; }

    /* Roll button */
    .roll-btn {
      background: var(--text);
      color: var(--bg);
      border: none;
      border-radius: 10px;
      padding: 15px 44px;
      font-size: 0.95rem;
      font-weight: 500;
      letter-spacing: 0.025em;
      cursor: pointer;
      transition: opacity 0.15s, transform 0.1s;
      margin-bottom: 44px;
      user-select: none;
    }
    .roll-btn:hover { opacity: 0.82; }
    .roll-btn:active { transform: scale(0.97); }
    .roll-btn.rolling { opacity: 0.45; pointer-events: none; }

    /* Dice area */
    .dice-area {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 16px;
      min-height: calc(var(--die) + 16px);
      margin-bottom: 40px;
    }

    /* Die shell */
    .die {
      width: var(--die);
      height: var(--die);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      box-shadow: var(--shadow);
      display: grid;
      padding: 10px;
      position: relative;
      overflow: hidden;
    }

    /* The inner content that scales */
    .die-inner {
      width: 100%;
      height: 100%;
      display: grid;
      transform-origin: center;
    }

    /* Tick: quick scale pulse */
    .die-inner.tick {
      animation: tick-scale 0.12s ease-out;
    }

    /* Landing: bigger satisfying pop */
    .die-inner.land {
      animation: land-pop 0.35s cubic-bezier(0.22, 0.68, 0, 1.3);
    }

    @keyframes tick-scale {
      0%   { transform: scale(1); }
      45%  { transform: scale(1.18); }
      100% { transform: scale(1); }
    }

    @keyframes land-pop {
      0%   { transform: scale(1); }
      35%  { transform: scale(1.28); }
      65%  { transform: scale(0.93); }
      100% { transform: scale(1); }
    }

    /* Dot layout — grid areas */
    .dot { width: 9px; height: 9px; background: var(--dot); border-radius: 50%; margin: auto; }

    .die-inner[data-v="1"] { grid-template-areas: ". . ." ". c ." ". . ."; }
    .die-inner[data-v="1"] .dot:nth-child(1) { grid-area: c; }

    .die-inner[data-v="2"] { grid-template-areas: ". . a" ". . ." "b . ."; }
    .die-inner[data-v="2"] .dot:nth-child(1) { grid-area: a; }
    .die-inner[data-v="2"] .dot:nth-child(2) { grid-area: b; }

    .die-inner[data-v="3"] { grid-template-areas: ". . a" ". c ." "b . ."; }
    .die-inner[data-v="3"] .dot:nth-child(1) { grid-area: a; }
    .die-inner[data-v="3"] .dot:nth-child(2) { grid-area: c; }
    .die-inner[data-v="3"] .dot:nth-child(3) { grid-area: b; }

    .die-inner[data-v="4"] { grid-template-areas: "a . b" ". . ." "c . d"; }
    .die-inner[data-v="4"] .dot:nth-child(1) { grid-area: a; }
    .die-inner[data-v="4"] .dot:nth-child(2) { grid-area: b; }
    .die-inner[data-v="4"] .dot:nth-child(3) { grid-area: c; }
    .die-inner[data-v="4"] .dot:nth-child(4) { grid-area: d; }

    .die-inner[data-v="5"] { grid-template-areas: "a . b" ". c ." "d . e"; }
    .die-inner[data-v="5"] .dot:nth-child(1) { grid-area: a; }
    .die-inner[data-v="5"] .dot:nth-child(2) { grid-area: b; }
    .die-inner[data-v="5"] .dot:nth-child(3) { grid-area: c; }
    .die-inner[data-v="5"] .dot:nth-child(4) { grid-area: d; }
    .die-inner[data-v="5"] .dot:nth-child(5) { grid-area: e; }

    .die-inner[data-v="6"] { grid-template-areas: "a . b" "c . d" "e . f"; }
    .die-inner[data-v="6"] .dot:nth-child(1) { grid-area: a; }
    .die-inner[data-v="6"] .dot:nth-child(2) { grid-area: b; }
    .die-inner[data-v="6"] .dot:nth-child(3) { grid-area: c; }
    .die-inner[data-v="6"] .dot:nth-child(4) { grid-area: d; }
    .die-inner[data-v="6"] .dot:nth-child(5) { grid-area: e; }
    .die-inner[data-v="6"] .dot:nth-child(6) { grid-area: f; }

    /* Score */
    .score-panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px 40px;
      box-shadow: var(--shadow);
      text-align: center;
      margin-bottom: 44px;
      transition: opacity 0.3s;
    }
    .score-label { font-size: 0.72rem; color: var(--muted); letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 4px; }
    #total-score { font-size: 2.8rem; font-weight: 700; letter-spacing: -0.04em; line-height: 1; }

    /* History */
    .history { width: 100%; max-width: 400px; }
    .history-title { font-size: 0.72rem; color: var(--muted); letter-spacing: 0.1em; text-transform: uppercase; text-align: center; margin-bottom: 12px; }
    .history-list { display: flex; flex-direction: column; gap: 7px; }
    .h-item {
      display: flex; align-items: center;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 11px 18px;
      font-size: 0.88rem;
      animation: slide-in 0.22s ease;
    }
    @keyframes slide-in {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .h-num  { color: var(--muted); font-size: 0.75rem; min-width: 28px; }
    .h-vals { flex: 1; text-align: center; color: var(--muted); font-size: 0.82rem; }
    .h-sum  { font-weight: 600; min-width: 28px; text-align: right; }
  </style>
</head>
<body>

  <header>
    <h1>Lancé de dés <span>·</span></h1>
  </header>

  <div class="controls">
    <span class="count-label">Dés</span>
    <div class="stepper">
      <button id="btn-min" onclick="step(-1)" aria-label="Moins">−</button>
      <span id="dice-count">2</span>
      <button id="btn-max" onclick="step(+1)" aria-label="Plus">+</button>
    </div>
  </div>

  <button class="roll-btn" id="roll-btn" onclick="roll()">Lancer</button>

  <div class="dice-area" id="dice-area"></div>

  <div class="score-panel" id="score-panel" style="visibility:hidden">
    <div class="score-label">Total</div>
    <div id="total-score">0</div>
  </div>

  <div class="history" id="history" style="display:none">
    <div class="history-title">Historique</div>
    <div class="history-list" id="history-list"></div>
  </div>

<script>
  const MIN = 1, MAX = 10;
  let n = 2, idx = 0;

  function step(d) {
    n = Math.max(MIN, Math.min(MAX, n + d));
    document.getElementById('dice-count').textContent = n;
    document.getElementById('btn-min').disabled = n <= MIN;
    document.getElementById('btn-max').disabled = n >= MAX;
  }

  function setInner(inner, val) {
    inner.dataset.v = val;
    inner.innerHTML = Array.from({ length: val }, () => '<div class="dot"></div>').join('');
  }

  function triggerAnim(inner, cls) {
    inner.classList.remove('tick', 'land');
    // Force reflow so re-adding the class restarts the animation
    void inner.offsetWidth;
    inner.classList.add(cls);
  }

  function createDie() {
    const die = document.createElement('div');
    die.className = 'die';
    const inner = document.createElement('div');
    inner.className = 'die-inner';
    die.appendChild(inner);
    return { die, inner };
  }

  // Build a schedule of delays with exponential easing (fast → slow)
  function buildSchedule(totalMs, startInterval, endInterval) {
    const times = [];
    let t = 0;
    let interval = startInterval;
    const growth = Math.pow(endInterval / startInterval, 1 / (totalMs / startInterval));
    while (t < totalMs) {
      times.push(Math.round(t));
      t += interval;
      interval = Math.min(interval * growth, endInterval);
    }
    return times;
  }

  function animateDie(inner, finalVal, delayOffset, onDone) {
    // Each die gets a slightly different total duration for a staggered feel
    const totalMs = 1100 + delayOffset * 60 + Math.random() * 200;
    const schedule = buildSchedule(totalMs, 50, 320);

    let last = 0;
    schedule.forEach((t, i) => {
      const isLast = i === schedule.length - 1;
      setTimeout(() => {
        let val;
        if (isLast) {
          val = finalVal;
          setInner(inner, val);
          triggerAnim(inner, 'land');
          onDone();
        } else {
          // Pick a different value from the previous one for visible change
          do { val = Math.ceil(Math.random() * 6); } while (val === last);
          last = val;
          setInner(inner, val);
          triggerAnim(inner, 'tick');
        }
      }, delayOffset * 40 + t);
    });
  }

  function roll() {
    const btn = document.getElementById('roll-btn');
    btn.classList.add('rolling');
    btn.textContent = '…';

    // Hide score during roll
    const scorePanel = document.getElementById('score-panel');
    scorePanel.style.visibility = 'hidden';

    const area = document.getElementById('dice-area');
    area.innerHTML = '';

    const vals = Array.from({ length: n }, () => Math.ceil(Math.random() * 6));
    let done = 0;

    vals.forEach((v, i) => {
      const { die, inner } = createDie();
      setInner(inner, 1); // start visible
      area.appendChild(die);

      animateDie(inner, v, i, () => {
        done++;
        if (done === n) {
          // All dice landed
          const total = vals.reduce((a, b) => a + b, 0);
          scorePanel.style.visibility = 'visible';
          document.getElementById('total-score').textContent = total;

          idx++;
          const histEl = document.getElementById('history');
          histEl.style.display = 'block';
          const list = document.getElementById('history-list');
          const row = document.createElement('div');
          row.className = 'h-item';
          row.innerHTML = `
            <span class="h-num">#${idx}</span>
            <span class="h-vals">${vals.join(' · ')}</span>
            <span class="h-sum">${total}</span>
          `;
          list.prepend(row);
          while (list.children.length > 12) list.removeChild(list.lastChild);

          btn.classList.remove('rolling');
          btn.textContent = 'Lancer';
        }
      });
    });
  }

  step(0);
</script>

</body>
</html>
