<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dés</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f7f5f2;
      --surface: #ffffff;
      --border: #e8e4de;
      --text: #1a1916;
      --muted: #9b9690;
      --dot: #1a1916;
      --shadow: 0 2px 16px rgba(0,0,0,0.06);
      --radius: 14px;
      --die-size: 72px;
    }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 56px 24px 96px;
    }

    header { text-align: center; margin-bottom: 52px; }
    h1 { font-size: 1.5rem; font-weight: 600; letter-spacing: -0.02em; }
    h1 span { color: var(--muted); font-weight: 400; }

    /* ── Controls ── */
    .controls {
      display: flex;
      align-items: center;
      gap: 24px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px 30px;
      box-shadow: var(--shadow);
      margin-bottom: 28px;
    }

    .count-label {
      font-size: 0.78rem;
      color: var(--muted);
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .stepper { display: flex; align-items: center; gap: 16px; }

    .stepper button {
      width: 30px; height: 30px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-size: 1rem;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.12s;
      user-select: none;
    }
    .stepper button:hover:not(:disabled) { background: var(--border); }
    .stepper button:disabled { opacity: 0.28; cursor: not-allowed; }

    #dice-count { font-size: 1.5rem; font-weight: 600; min-width: 26px; text-align: center; }

    /* ── Roll button ── */
    .roll-btn {
      background: var(--text);
      color: var(--bg);
      border: none;
      border-radius: 10px;
      padding: 15px 44px;
      font-size: 0.95rem;
      font-weight: 500;
      letter-spacing: 0.025em;
      cursor: pointer;
      transition: opacity 0.15s, transform 0.1s;
      margin-bottom: 44px;
      user-select: none;
    }
    .roll-btn:hover { opacity: 0.82; }
    .roll-btn:active { transform: scale(0.97); }
    .roll-btn.rolling { opacity: 0.5; pointer-events: none; }

    /* ── Dice area ── */
    .dice-area {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
      min-height: calc(var(--die-size) + 20px);
      margin-bottom: 40px;
      perspective: 600px;
    }

    /* ── 3D Die wrapper ── */
    .die-scene {
      width: var(--die-size);
      height: var(--die-size);
      perspective: 400px;
    }

    .die-3d {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
    }

    /* Spin animation: random via JS-set custom property */
    .die-3d.spinning {
      animation: spin3d var(--spin-dur, 0.6s) cubic-bezier(0.22, 0.68, 0, 1.1) forwards;
    }

    @keyframes spin3d {
      0%   { transform: rotateX(0deg)   rotateY(0deg)   rotateZ(0deg) scale3d(0.6,0.6,0.6); opacity: 0.3; }
      30%  { opacity: 1; }
      60%  { transform: rotateX(var(--rx, 360deg)) rotateY(var(--ry, 540deg)) rotateZ(var(--rz, 90deg)) scale3d(1.08,1.08,1.08); }
      100% { transform: rotateX(var(--rx, 360deg)) rotateY(var(--ry, 540deg)) rotateZ(var(--rz, 90deg)) scale3d(1,1,1); opacity: 1; }
    }

    /* Six faces of the cube */
    .face {
      position: absolute;
      width: var(--die-size);
      height: var(--die-size);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.6), var(--shadow);
      display: grid;
      padding: 10px;
      backface-visibility: hidden;
    }

    .face-front  { transform: translateZ(calc(var(--die-size) / 2)); }
    .face-back   { transform: rotateY(180deg) translateZ(calc(var(--die-size) / 2)); }
    .face-right  { transform: rotateY(90deg)  translateZ(calc(var(--die-size) / 2)); }
    .face-left   { transform: rotateY(-90deg) translateZ(calc(var(--die-size) / 2)); }
    .face-top    { transform: rotateX(90deg)  translateZ(calc(var(--die-size) / 2)); }
    .face-bottom { transform: rotateX(-90deg) translateZ(calc(var(--die-size) / 2)); }

    /* Dot layout using CSS grid areas */
    .dot {
      width: 9px; height: 9px;
      background: var(--dot);
      border-radius: 50%;
      margin: auto;
    }

    /* face-1 */
    .f1 { grid-template-areas: ". . ." ". c ." ". . ."; }
    .f1 .dot:nth-child(1) { grid-area: c; }

    /* face-2 */
    .f2 { grid-template-areas: ". . a" ". . ." "b . ."; }
    .f2 .dot:nth-child(1) { grid-area: a; }
    .f2 .dot:nth-child(2) { grid-area: b; }

    /* face-3 */
    .f3 { grid-template-areas: ". . a" ". c ." "b . ."; }
    .f3 .dot:nth-child(1) { grid-area: a; }
    .f3 .dot:nth-child(2) { grid-area: c; }
    .f3 .dot:nth-child(3) { grid-area: b; }

    /* face-4 */
    .f4 { grid-template-areas: "a . b" ". . ." "c . d"; }
    .f4 .dot:nth-child(1) { grid-area: a; }
    .f4 .dot:nth-child(2) { grid-area: b; }
    .f4 .dot:nth-child(3) { grid-area: c; }
    .f4 .dot:nth-child(4) { grid-area: d; }

    /* face-5 */
    .f5 { grid-template-areas: "a . b" ". c ." "d . e"; }
    .f5 .dot:nth-child(1) { grid-area: a; }
    .f5 .dot:nth-child(2) { grid-area: b; }
    .f5 .dot:nth-child(3) { grid-area: c; }
    .f5 .dot:nth-child(4) { grid-area: d; }
    .f5 .dot:nth-child(5) { grid-area: e; }

    /* face-6 */
    .f6 { grid-template-areas: "a . b" "c . d" "e . f"; }
    .f6 .dot:nth-child(1) { grid-area: a; }
    .f6 .dot:nth-child(2) { grid-area: b; }
    .f6 .dot:nth-child(3) { grid-area: c; }
    .f6 .dot:nth-child(4) { grid-area: d; }
    .f6 .dot:nth-child(5) { grid-area: e; }
    .f6 .dot:nth-child(6) { grid-area: f; }

    /* ── Score ── */
    .score-panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px 40px;
      box-shadow: var(--shadow);
      text-align: center;
      margin-bottom: 44px;
    }
    .score-label { font-size: 0.72rem; color: var(--muted); letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 4px; }
    #total-score { font-size: 2.8rem; font-weight: 700; letter-spacing: -0.04em; line-height: 1; }

    /* ── History ── */
    .history { width: 100%; max-width: 400px; }
    .history-title { font-size: 0.72rem; color: var(--muted); letter-spacing: 0.1em; text-transform: uppercase; text-align: center; margin-bottom: 12px; }
    .history-list { display: flex; flex-direction: column; gap: 7px; }

    .h-item {
      display: flex;
      align-items: center;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 11px 18px;
      font-size: 0.88rem;
      animation: slide-in 0.22s ease;
    }
    @keyframes slide-in {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .h-num  { color: var(--muted); font-size: 0.75rem; min-width: 28px; }
    .h-vals { flex: 1; text-align: center; color: var(--muted); font-size: 0.82rem; }
    .h-sum  { font-weight: 600; min-width: 28px; text-align: right; }
  </style>
</head>
<body>

  <header>
    <h1>Lancé de dés <span>·</span></h1>
  </header>

  <div class="controls">
    <span class="count-label">Dés</span>
    <div class="stepper">
      <button id="btn-min" onclick="step(-1)" aria-label="Moins">−</button>
      <span id="dice-count">2</span>
      <button id="btn-max" onclick="step(+1)" aria-label="Plus">+</button>
    </div>
  </div>

  <button class="roll-btn" id="roll-btn" onclick="roll()">Lancer</button>

  <div class="dice-area" id="dice-area"></div>

  <div class="score-panel" id="score-panel" style="visibility:hidden">
    <div class="score-label">Total</div>
    <div id="total-score">0</div>
  </div>

  <div class="history" id="history" style="display:none">
    <div class="history-title">Historique</div>
    <div class="history-list" id="history-list"></div>
  </div>

<script>
  const MIN = 1, MAX = 10;
  let n = 2, idx = 0;

  // Opposite faces on a standard die
  const OPPOSITE = { 1:6, 2:5, 3:4, 4:3, 5:2, 6:1 };

  // Final rotation to show each face on the front
  // (rotateX, rotateY) so the front face shows the desired value
  const FACE_ROT = {
    1: [0,   0],
    2: [0,   -90],
    3: [-90, 0],
    4: [90,  0],
    5: [0,   90],
    6: [0,   180],
  };

  function step(d) {
    n = Math.max(MIN, Math.min(MAX, n + d));
    document.getElementById('dice-count').textContent = n;
    document.getElementById('btn-min').disabled = n <= MIN;
    document.getElementById('btn-max').disabled = n >= MAX;
  }

  function dots(count) {
    return Array.from({ length: count }, () => '<div class="dot"></div>').join('');
  }

  function makeDie3D(value) {
    const scene = document.createElement('div');
    scene.className = 'die-scene';

    const cube = document.createElement('div');
    cube.className = 'die-3d';

    // Extra random full rotations for drama (multiples of 360 so face is correct)
    const extraX = (Math.floor(Math.random() * 3) + 1) * 360;
    const extraY = (Math.floor(Math.random() * 3) + 1) * 360;
    const extraZ = (Math.random() > 0.5 ? 1 : -1) * (Math.floor(Math.random() * 2)) * 180;

    const [baseX, baseY] = FACE_ROT[value];
    const finalX = baseX + extraX;
    const finalY = baseY + extraY;
    const finalZ = extraZ;
    const dur = 0.55 + Math.random() * 0.25;

    cube.style.setProperty('--rx', finalX + 'deg');
    cube.style.setProperty('--ry', finalY + 'deg');
    cube.style.setProperty('--rz', finalZ + 'deg');
    cube.style.setProperty('--spin-dur', dur + 's');

    // Standard die layout: front=value, back=opposite, right=5, left=2, top=4, bottom=3
    // We just put all 6 faces with their values
    const faces = [
      { cls: 'face-front',  val: value },
      { cls: 'face-back',   val: OPPOSITE[value] },
      { cls: 'face-right',  val: 5 },
      { cls: 'face-left',   val: 2 },
      { cls: 'face-top',    val: 4 },
      { cls: 'face-bottom', val: 3 },
    ];

    faces.forEach(({ cls, val }) => {
      const face = document.createElement('div');
      face.className = `face ${cls} f${val}`;
      face.innerHTML = dots(val);
      cube.appendChild(face);
    });

    scene.appendChild(cube);
    return { scene, cube };
  }

  function roll() {
    const btn = document.getElementById('roll-btn');
    btn.classList.add('rolling');
    btn.textContent = '…';

    const area = document.getElementById('dice-area');
    area.innerHTML = '';

    const vals = Array.from({ length: n }, () => Math.ceil(Math.random() * 6));
    let maxDur = 0;

    vals.forEach((v, i) => {
      const { scene, cube } = makeDie3D(v);
      area.appendChild(scene);

      // Stagger start
      const delay = i * 70;
      const dur = parseFloat(cube.style.getPropertyValue('--spin-dur'));
      maxDur = Math.max(maxDur, delay + dur * 1000);

      setTimeout(() => cube.classList.add('spinning'), delay);
    });

    setTimeout(() => {
      const total = vals.reduce((a, b) => a + b, 0);
      const scorePanel = document.getElementById('score-panel');
      scorePanel.style.visibility = 'visible';
      document.getElementById('total-score').textContent = total;

      idx++;
      const histEl = document.getElementById('history');
      histEl.style.display = 'block';
      const list = document.getElementById('history-list');

      const row = document.createElement('div');
      row.className = 'h-item';
      row.innerHTML = `
        <span class="h-num">#${idx}</span>
        <span class="h-vals">${vals.join(' · ')}</span>
        <span class="h-sum">${total}</span>
      `;
      list.prepend(row);
      while (list.children.length > 12) list.removeChild(list.lastChild);

      btn.classList.remove('rolling');
      btn.textContent = 'Lancer';
    }, maxDur + 80);
  }

  step(0);
</script>

</body>
</html>
