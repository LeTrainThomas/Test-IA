<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dés</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f7f5f2;
      --surface: #ffffff;
      --border: #e8e4de;
      --text: #1a1916;
      --muted: #9b9690;
      --dot: #1a1916;
      --shadow: 0 2px 20px rgba(0,0,0,0.07);
      --radius: 14px;
      --die: 78px;
    }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 56px 24px 96px;
    }

    header { text-align: center; margin-bottom: 52px; }
    h1 { font-size: 1.5rem; font-weight: 600; letter-spacing: -0.02em; }
    h1 span { color: var(--muted); font-weight: 400; }

    /* Controls */
    .controls {
      display: flex; align-items: center; gap: 24px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px 30px;
      box-shadow: var(--shadow);
      margin-bottom: 28px;
    }
    .count-label { font-size: 0.78rem; color: var(--muted); letter-spacing: 0.06em; text-transform: uppercase; }
    .stepper { display: flex; align-items: center; gap: 16px; }
    .stepper button {
      width: 30px; height: 30px; border-radius: 50%;
      border: 1px solid var(--border); background: var(--bg); color: var(--text);
      font-size: 1rem; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.12s; user-select: none;
    }
    .stepper button:hover:not(:disabled) { background: var(--border); }
    .stepper button:disabled { opacity: 0.28; cursor: not-allowed; }
    #dice-count { font-size: 1.5rem; font-weight: 600; min-width: 26px; text-align: center; }

    /* Roll button */
    .roll-btn {
      background: var(--text); color: var(--bg);
      border: none; border-radius: 10px;
      padding: 15px 44px; font-size: 0.95rem; font-weight: 500; letter-spacing: 0.025em;
      cursor: pointer; transition: opacity 0.15s, transform 0.1s;
      margin-bottom: 44px; user-select: none;
    }
    .roll-btn:hover { opacity: 0.82; }
    .roll-btn:active { transform: scale(0.97); }
    .roll-btn.rolling { opacity: 0.45; pointer-events: none; }

    /* Dice area */
    .dice-area {
      display: flex; flex-wrap: wrap; justify-content: center;
      gap: 18px;
      min-height: calc(var(--die) + 18px);
      margin-bottom: 40px;
    }

    /* Die shell — shake/blur are applied here via JS */
    .die {
      width: var(--die); height: var(--die);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      box-shadow: var(--shadow);
      display: grid;
      padding: 10px;
      will-change: transform, filter;
    }

    /* Dot face layouts */
    .die[data-v="1"] { grid-template-areas: ". . ." ". c ." ". . ."; }
    .die[data-v="1"] .dot:nth-child(1) { grid-area: c; }

    .die[data-v="2"] { grid-template-areas: ". . a" ". . ." "b . ."; }
    .die[data-v="2"] .dot:nth-child(1) { grid-area: a; }
    .die[data-v="2"] .dot:nth-child(2) { grid-area: b; }

    .die[data-v="3"] { grid-template-areas: ". . a" ". c ." "b . ."; }
    .die[data-v="3"] .dot:nth-child(1) { grid-area: a; }
    .die[data-v="3"] .dot:nth-child(2) { grid-area: c; }
    .die[data-v="3"] .dot:nth-child(3) { grid-area: b; }

    .die[data-v="4"] { grid-template-areas: "a . b" ". . ." "c . d"; }
    .die[data-v="4"] .dot:nth-child(1) { grid-area: a; }
    .die[data-v="4"] .dot:nth-child(2) { grid-area: b; }
    .die[data-v="4"] .dot:nth-child(3) { grid-area: c; }
    .die[data-v="4"] .dot:nth-child(4) { grid-area: d; }

    .die[data-v="5"] { grid-template-areas: "a . b" ". c ." "d . e"; }
    .die[data-v="5"] .dot:nth-child(1) { grid-area: a; }
    .die[data-v="5"] .dot:nth-child(2) { grid-area: b; }
    .die[data-v="5"] .dot:nth-child(3) { grid-area: c; }
    .die[data-v="5"] .dot:nth-child(4) { grid-area: d; }
    .die[data-v="5"] .dot:nth-child(5) { grid-area: e; }

    .die[data-v="6"] { grid-template-areas: "a . b" "c . d" "e . f"; }
    .die[data-v="6"] .dot:nth-child(1) { grid-area: a; }
    .die[data-v="6"] .dot:nth-child(2) { grid-area: b; }
    .die[data-v="6"] .dot:nth-child(3) { grid-area: c; }
    .die[data-v="6"] .dot:nth-child(4) { grid-area: d; }
    .die[data-v="6"] .dot:nth-child(5) { grid-area: e; }
    .die[data-v="6"] .dot:nth-child(6) { grid-area: f; }

    .dot {
      width: 9px; height: 9px;
      background: var(--dot); border-radius: 50%;
      margin: auto;
      transition: transform 0.04s ease;
    }

    /* Landing pop */
    @keyframes land {
      0%   { transform: scale(1); }
      35%  { transform: scale(1.22); }
      62%  { transform: scale(0.92); }
      82%  { transform: scale(1.06); }
      100% { transform: scale(1); }
    }
    .die.landed { animation: land 0.38s cubic-bezier(0.22, 0.68, 0, 1.2); }

    /* Score */
    .score-panel {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 20px 40px;
      box-shadow: var(--shadow); text-align: center; margin-bottom: 44px;
    }
    .score-label { font-size: 0.72rem; color: var(--muted); letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 4px; }
    #total-score { font-size: 2.8rem; font-weight: 700; letter-spacing: -0.04em; line-height: 1; }

    /* History */
    .history { width: 100%; max-width: 400px; }
    .history-title { font-size: 0.72rem; color: var(--muted); letter-spacing: 0.1em; text-transform: uppercase; text-align: center; margin-bottom: 12px; }
    .history-list { display: flex; flex-direction: column; gap: 7px; }
    .h-item {
      display: flex; align-items: center;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 10px; padding: 11px 18px; font-size: 0.88rem;
      animation: fadein 0.22s ease;
    }
    @keyframes fadein {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .h-num  { color: var(--muted); font-size: 0.75rem; min-width: 28px; }
    .h-vals { flex: 1; text-align: center; color: var(--muted); font-size: 0.82rem; }
    .h-sum  { font-weight: 600; min-width: 28px; text-align: right; }
  </style>
</head>
<body>

  <header><h1>Lancé de dés <span>·</span></h1></header>

  <div class="controls">
    <span class="count-label">Dés</span>
    <div class="stepper">
      <button id="btn-min" onclick="step(-1)">−</button>
      <span id="dice-count">2</span>
      <button id="btn-max" onclick="step(+1)">+</button>
    </div>
  </div>

  <button class="roll-btn" id="roll-btn" onclick="roll()">Lancer</button>

  <div class="dice-area" id="dice-area"></div>

  <div class="score-panel" id="score-panel" style="visibility:hidden">
    <div class="score-label">Total</div>
    <div id="total-score">0</div>
  </div>

  <div class="history" id="history" style="display:none">
    <div class="history-title">Historique</div>
    <div class="history-list" id="history-list"></div>
  </div>

<script>
  const MIN = 1, MAX = 10;
  let n = 2, rollIdx = 0;

  function step(d) {
    n = Math.max(MIN, Math.min(MAX, n + d));
    document.getElementById('dice-count').textContent = n;
    document.getElementById('btn-min').disabled = n <= MIN;
    document.getElementById('btn-max').disabled = n >= MAX;
  }

  function setFace(die, v) {
    die.dataset.v = v;
    die.innerHTML = Array.from({ length: v }, () => '<div class="dot"></div>').join('');
  }

  // Smooth cubic ease-out
  function easeOut(t) { return 1 - Math.pow(1 - t, 3); }

  // Animate a single die: smooth shake + blur via rAF, face changes slow down naturally
  function animateDie(die, finalVal, offsetMs, onDone) {
    const duration = 1300 + offsetMs * 0.6 + Math.random() * 150;
    // Face flip interval: goes from ~55ms → ~400ms as eased progress increases
    const flipFast = 55, flipSlow = 420;

    let startTs = null;
    let lastFlipElapsed = -999;
    let lastVal = Math.ceil(Math.random() * 6);
    let done = false;

    setFace(die, lastVal);

    function frame(ts) {
      if (!startTs) startTs = ts;
      const raw = ts - startTs - offsetMs;

      if (raw < 0) { requestAnimationFrame(frame); return; }

      const t  = Math.min(raw / duration, 1);
      const e  = easeOut(t);
      const speed = 1 - e; // 1 = max speed, 0 = stopped

      // ── Smooth sinusoidal shake (amplitude fades with speed) ──
      const amp = speed * 6;
      const sx  = Math.sin(raw * 0.055) * amp;
      const sy  = Math.cos(raw * 0.071) * amp * 0.7;
      const sr  = Math.sin(raw * 0.038) * amp * 0.4;
      die.style.transform = `translate(${sx.toFixed(2)}px, ${sy.toFixed(2)}px) rotate(${sr.toFixed(2)}deg)`;

      // ── Motion blur proportional to speed ──
      die.style.filter = `blur(${(speed * 3.5).toFixed(2)}px)`;

      // ── Face cycling ──
      const flipInterval = flipFast + (flipSlow - flipFast) * e;
      if (raw - lastFlipElapsed >= flipInterval) {
        lastFlipElapsed = raw;

        if (t >= 1 && !done) {
          done = true;
          die.style.transform = '';
          die.style.filter = '';
          setFace(die, finalVal);
          die.classList.remove('landed');
          void die.offsetWidth;
          die.classList.add('landed');
          onDone();
          return;
        }

        // Pick a different face than current
        let v;
        do { v = Math.ceil(Math.random() * 6); } while (v === lastVal);
        lastVal = v;
        setFace(die, v);
      }

      if (!done) requestAnimationFrame(frame);
    }

    requestAnimationFrame(frame);
  }

  function roll() {
    const btn = document.getElementById('roll-btn');
    btn.classList.add('rolling');
    btn.textContent = '…';
    document.getElementById('score-panel').style.visibility = 'hidden';

    const area = document.getElementById('dice-area');
    area.innerHTML = '';

    const vals = Array.from({ length: n }, () => Math.ceil(Math.random() * 6));
    let settled = 0;

    vals.forEach((v, i) => {
      const die = document.createElement('div');
      die.className = 'die';
      area.appendChild(die);
      // Stagger: each die starts 60ms after the previous
      animateDie(die, v, i * 60, () => {
        settled++;
        if (settled < n) return;

        // All done
        const total = vals.reduce((a, b) => a + b, 0);
        const panel = document.getElementById('score-panel');
        panel.style.visibility = 'visible';
        document.getElementById('total-score').textContent = total;

        rollIdx++;
        const histEl = document.getElementById('history');
        histEl.style.display = 'block';
        const list = document.getElementById('history-list');
        const row = document.createElement('div');
        row.className = 'h-item';
        row.innerHTML = `
          <span class="h-num">#${rollIdx}</span>
          <span class="h-vals">${vals.join(' · ')}</span>
          <span class="h-sum">${total}</span>`;
        list.prepend(row);
        while (list.children.length > 12) list.removeChild(list.lastChild);

        btn.classList.remove('rolling');
        btn.textContent = 'Lancer';
      });
    });
  }

  step(0);
</script>
</body>
</html>
